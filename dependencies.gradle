dependencies {
    elytraModpackVersion {
        setGtnhVersion("2.9.0")
        // Elytra v1.1.2 passes this flag as allowFromCaching, so true reuses the pinned manifest.
        setManifestNoCache(true)
    }

    // GTNH mods
    implementation(gtnh("GT5-Unofficial"))
    implementation(gtnh("GTNHLib"))
    compileOnly(gtnh("Angelica"))
    implementation(gtnh("NewHorizonsCoreMod"))
    implementation(gtnh("Hodgepodge"))
    implementation(gtnh("supersolarpanels"))
    implementation(gtnh("EnderCore"))
    implementation(gtnh("EnderIO"))
    implementation(gtnh("AE2FluidCraft-Rework"))
    implementation(gtnh("Avaritia"))
    implementation(gtnh("Avaritiaddons"))
    implementation(gtnh("Eternal-Singularity"))
    implementation(gtnh("Universal-Singularities"))
    implementation(gtnh("ThaumicEnergistics"))
    implementation(gtnh("AspectRecipeIndex"))
    implementation(gtnh("Electro-Magic-Tools"))
    implementation(gtnh("Botania"))
    implementation(gtnh("BloodMagic"))
    implementation(gtnh("WitcheryExtras"))
    implementation(gtnh("ForestryMC"))
    implementation(gtnh("MagicBees"))
    implementation(gtnh("CropsNH"))
    implementation(gtnh("Natura"))
    implementation(gtnh("Galaxy-Space-GTNH"))
    implementation(gtnh("twilightforest"))
    implementation("net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev")
    implementation(rfg.deobf('curse.maven:advsolar-362768:2885953'))
    implementation("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev")
    implementation(deobfCurse('witchery-69673:2234410'))

    // Compile-only due to conflicts with Thaumcraft and Advanced Solar Panels; see #150.
    compileOnly(gtnh("amunra"))
    // Development tools for multiblock construction and structure debugging.
    runtimeOnlyNonPublishable(gtnh("BetterBuildersWands"))
    runtimeOnlyNonPublishable(gtnh("BlockRenderer6343")) { transitive = false }
    // GT bee recipes need Thaumic Bases resources and Extra Bees products in the development client.
    runtimeOnlyNonPublishable(gtnh("ThaumicBases"))
    runtimeOnlyNonPublishable(gtnh("Binnie"))
    runtimeOnlyNonPublishable(rfg.deobf("curse.maven:extra-utilities-225561:2264384"))
    // Biome content for development world-generation testing.
    runtimeOnlyNonPublishable(rfg.deobf("curse.maven:BiomesOPlenty-220318:2499612"))

    // Compile-time annotations and annotation processors
    implementation('com.google.auto.value:auto-value-annotations:1.10.1')
    annotationProcessor('com.google.auto.value:auto-value:1.10.1')
    compileOnly("org.jetbrains:annotations:26.0.1")
    compileOnly("org.projectlombok:lombok:1.18.42") { transitive = false }
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    // JVM downgrader compatibility
    compileOnly("javax.xml.bind:jaxb-api:2.3.1")
}

// Resolve GTNH development artifacts from the selected modpack manifest.
String gtnh(String name) {
    return project.elytraModpackVersion.gtnhdev(name)
}
